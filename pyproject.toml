[project]
name = "ambergris"
version = "0.1.0"
description = "Authorable simulation prototype tools"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.12,<4",
    "build123d==0.12.0",
    "numpy>=2.0,<3",
    "openai>=2,<3",
    "pyarrow>=20,<25",
    "scipy>=1.14,<2",
    "websockets>=15,<17",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
    "gdtoolkit>=4.5.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
